<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Galeria de Fotos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">

<!-- TELA DE LOGIN -->
    <div id="telaLogin" class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
            <div class="card-body p-4">

        <h3 class="text-center mb-4">Login</h3>
            <form id="meuFormulario">
            <div class="mb-3">
            <label class="form-label">Usuário</label>
        <input type="text" class="form-control" id="usuario" required> </div>
        
        <div class="mb-3">
            <label class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" required> </div>
            <button type="submit" class="btn btn-primary w-100" id="btnEntrar"> Entrar </button>
        </form> 
            <div id="mensagem" class="mt-3"></div>
        </div>
      </div>
   </div>
</div>

<!-- TELA DA GALERIA -->
        <div id="telaHome" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Galeria de Fotos</h2>
            <button class="btn btn-danger" id="btnSair"> Sair </button>
        </div>

<!-- LISTA DE FOTOS -->
        <div id="telaLista">
            <p>Clique em uma foto para visualizar em tamanho maior.</p>
        <div id="mensagemFotos"></div>
            <div id="listaFotos" class="list-group"></div>
        </div>


<!-- FOTO AMPLIADA -->
        <div id="telaDetalhe" class="d-none">
            <button class="btn btn-secondary mb-3" id="btnVoltar"> Voltar para a lista </button>
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h4 id="tituloFoto" class="mb-3"></h4>
        
            <img id="imagemGrande" class="img-fluid imagem-grande" src="" alt="">
          </div>
        </div>
      </div>
    </div>
</div>

<!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
